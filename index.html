<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KEITH</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Urbanist:wght@600&display=swap">
<style>
/* Night Glow · signal gold. Layout: one phone column, hero number up top, glass cards, floating dock. */
:root{
  --bg:#050708;--bg-2:#0B0F10;--ink:#E9EDEE;--haze:#B7C0C3;--mist:#8A9497;--dim:#5D6669;
  --glass:rgba(233,237,238,.07);--glass-line:rgba(233,237,238,.14);
  --chip:rgba(233,237,238,.06);--chip-line:rgba(233,237,238,.12);
  --dock:rgba(18,22,24,.82);
  --signal:#E2C48A;--signal-ink:#1A1408;--signal-12:rgba(226,196,138,.12);--signal-30:rgba(226,196,138,.3);
  --ease:cubic-bezier(.2,.7,.2,1);--quick:160ms;--std:320ms;--slow:640ms;
  --ui:"Onest",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --head:"Urbanist","Onest",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(70% 45% at 50% -10%,rgba(226,196,138,.16),transparent 60%),radial-gradient(60% 40% at 80% 110%,rgba(125,156,140,.10),transparent 60%)}
body::after{content:"";position:fixed;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--signal);outline-offset:3px;border-radius:999px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100%;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}

/* top row */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.wordmark{font-family:var(--head);font-weight:600;letter-spacing:-.02em;font-size:18px}
.wordmark i{font-style:normal;color:var(--signal)}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--chip);border:1px solid var(--chip-line);display:inline-flex;align-items:center;justify-content:center;transition:transform var(--quick) var(--ease),background var(--quick)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero metric */
.hero{margin:6px 0 22px}
.hero .num{font-weight:300;font-size:84px;line-height:.95;letter-spacing:-3px;display:flex;align-items:baseline;gap:10px}
.hero .num small{font:400 14px var(--ui);color:var(--mist);letter-spacing:0}
.hero .sub{margin-top:8px;color:var(--mist);font-size:15px}
.hero .sub b{color:var(--ink);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;background:var(--chip);border:1px solid var(--chip-line);color:var(--haze)}
.chip.sig{background:var(--signal-12);border-color:var(--signal-30);color:var(--signal)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

/* glass */
.glass{border-radius:24px;padding:16px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card{margin-top:12px;transform:translateY(16px);opacity:0;animation:rise var(--std) var(--ease) forwards}
.card:nth-child(2){animation-delay:60ms}.card:nth-child(3){animation-delay:120ms}.card:nth-child(4){animation-delay:180ms}.card:nth-child(n+5){animation-delay:240ms}
@keyframes rise{to{transform:none;opacity:1}}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.rel{color:var(--mist);font-size:13px;margin-top:2px}
.story{margin:10px 0 0;color:var(--haze);font-size:14.5px;line-height:1.5}
.tell{margin:10px 0 0;font-size:14px;color:var(--ink)}
.tell .label{color:var(--signal);margin-right:8px}
.draft{width:100%;margin-top:12px;min-height:84px;background:rgba(0,0,0,.25);border:1px solid var(--chip-line);border-radius:16px;padding:10px 12px;resize:vertical;font-size:14.5px;line-height:1.5;color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--chip-line);background:var(--chip);font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);transition:transform var(--quick) var(--ease),background var(--quick),opacity var(--quick)}
.pill:active{transform:scale(.96)}
.pill.solid{background:var(--ink);color:#0A0D0E;border-color:var(--ink)}
.pill.gold{background:linear-gradient(90deg,#F3E4C2,#E2C48A);color:var(--signal-ink);border-color:transparent}
.pill.ghost{background:transparent;border-color:transparent;color:var(--mist)}
.pill:disabled{opacity:.45;cursor:default}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px}
.sh h2{font:500 22px/1.2 var(--ui);letter-spacing:-.01em;margin:0}
.sh h2 span{color:var(--dim);font-weight:400;margin-left:10px}
.empty{border:1px dashed var(--chip-line);border-radius:24px;padding:22px 18px;color:var(--mist);text-align:center;margin-top:12px}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:16px;margin-bottom:4px}

/* tracker */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{border-radius:24px;padding:14px;background:var(--glass);border:1px solid var(--glass-line);position:relative;overflow:hidden;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.tile .v{font-weight:300;font-size:38px;letter-spacing:-1.5px;line-height:1}
.tile .v small{font-size:13px;color:var(--mist);letter-spacing:0;margin-left:4px}
.tile .label{margin-top:6px}
.tile.glow::before{content:"";position:absolute;inset:auto -30% -50% -30%;height:120%;filter:blur(28px);opacity:.55;
  background:radial-gradient(60% 60% at 50% 60%,#E2C48A 0%,#8C6B2A 40%,transparent 75%)}
.tile.sage::before{content:"";position:absolute;inset:auto -30% -50% -30%;height:120%;filter:blur(28px);opacity:.45;
  background:radial-gradient(60% 60% at 50% 60%,#7D9C8C 0%,#2F4A3E 45%,transparent 75%)}
.bars{display:flex;align-items:flex-end;gap:4px;height:46px;margin-top:10px}
.bars i{flex:1;background:rgba(233,237,238,.55);border-radius:1px;min-height:2px;transition:height var(--slow) var(--ease)}
.bars i.hi{background:var(--signal)}
.rule{position:relative;height:2px;background:rgba(233,237,238,.2);border-radius:2px;margin:14px 0 6px}
.rule b{position:absolute;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--signal);box-shadow:0 0 12px var(--signal-30);transform:translateX(-50%);transition:left var(--slow) var(--ease)}
.legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.ring{display:flex;gap:10px;margin-top:12px}
.ring .g{flex:1;aspect-ratio:1;max-width:120px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2}
.ring .t{stroke:rgba(233,237,238,.15)}
.ring .a{stroke:var(--haze);stroke-linecap:round;transition:stroke-dasharray var(--slow) var(--ease)}
.ring .g.sig .a{stroke:var(--signal);filter:drop-shadow(0 0 6px var(--signal-30))}
.ring .n{font-weight:300;font-size:28px;letter-spacing:-1px;line-height:1}
.ring .l{position:absolute;bottom:-18px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}

/* Keith (voice) */
.orb-wrap{display:grid;place-items:center;margin:8px 0 6px;position:relative;height:220px}
.orb{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(60% 60% at 40% 35%,rgba(243,228,194,.9),rgba(226,196,138,.55) 45%,rgba(140,107,42,.25) 75%,transparent 100%);
  box-shadow:0 0 60px rgba(226,196,138,.25),inset 0 0 30px rgba(255,255,255,.08);
  transition:transform var(--std) var(--ease),box-shadow var(--std) var(--ease)}
.orb::before,.orb::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid var(--signal-30);opacity:.6}
.orb::after{inset:-26px;opacity:.3}
@media (prefers-reduced-motion:no-preference){
  .orb{animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
  .orb.listening{animation:listen 1.1s ease-in-out infinite}
  @keyframes listen{0%,100%{transform:scale(1);box-shadow:0 0 60px rgba(226,196,138,.25)}50%{transform:scale(1.08);box-shadow:0 0 90px rgba(226,196,138,.5)}}
  .orb.talking::before{animation:ripple 1.4s var(--ease) infinite}
  @keyframes ripple{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
  .orb.thinking{animation:spin 2.4s linear infinite;background:conic-gradient(from 0deg,rgba(226,196,138,.1),rgba(226,196,138,.7),rgba(226,196,138,.1))}
  @keyframes spin{to{transform:rotate(360deg)}}
}
.orb-state{position:absolute;bottom:4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.chapters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chapters .chip{flex:none;height:34px;transition:background var(--quick),color var(--quick)}
.chapters .chip.on{background:var(--ink);color:#0A0D0E;border-color:var(--ink)}
.chapters .chip .ok{color:var(--signal)}
.chapters .chip.on .ok{color:#6B5A00}
.thread{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px;min-height:80px}
.msg{max-width:88%;padding:11px 15px;border-radius:20px;font-size:15.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;
  transform:translateY(10px);opacity:0;animation:rise var(--std) var(--ease) forwards}
.msg.k{align-self:flex-start;background:var(--glass);border:1px solid var(--glass-line);border-bottom-left-radius:6px}
.msg.u{align-self:flex-end;background:var(--signal-12);border:1px solid var(--signal-30);border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:0}
.msg.live{color:var(--haze);border-style:dashed}
.composer{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:24px;padding:10px;background:var(--dock);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.composer textarea{width:100%;background:transparent;border:none;outline:none;resize:none;min-height:44px;max-height:160px;font-size:15px;padding:4px 6px;color:var(--ink)}
.composer .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mic{width:56px;height:56px;border-radius:50%;background:linear-gradient(90deg,#F3E4C2,#E2C48A);color:var(--signal-ink);border:none;display:grid;place-items:center;
  box-shadow:0 0 24px rgba(226,196,138,.35);transition:transform var(--quick) var(--ease),box-shadow var(--std)}
.mic:active{transform:scale(.94)}
.mic.on{background:var(--ink);box-shadow:0 0 0 6px rgba(233,237,238,.12)}
.mic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12.5px;color:var(--mist)}

/* people */
.search{width:100%;height:46px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);padding:0 18px;margin:10px 0 8px;color:var(--ink)}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:8px 14px 8px 8px;margin-top:8px;transition:transform var(--quick) var(--ease)}
.prow:active{transform:scale(.985)}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:500;font-size:14px;background:var(--chip);border:1px solid var(--chip-line);color:var(--haze)}
.av.sig{background:var(--signal-12);border-color:var(--signal-30);color:var(--signal)}
.prow .who{min-width:0;flex:1}
.prow .who b{font-weight:500;font-size:15.5px;display:block}
.prow .who span{color:var(--mist);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.state{width:8px;height:8px;border-radius:50%;flex:none}
.state.warm{background:var(--signal);box-shadow:0 0 8px var(--signal-30)}
.state.cool{background:var(--haze)}
.state.cold{background:var(--dim)}
.state.lost{background:transparent;border:1px solid var(--mist)}
.group{margin-top:16px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:min(100% - 44px,380px);height:62px;border-radius:999px;
  background:var(--dock);border:1px solid var(--glass-line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:6px;gap:4px}
.dock button{border:none;background:none;border-radius:999px;color:var(--mist);display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13.5px;transition:background var(--std) var(--ease),color var(--std)}
.dock button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dock button span{display:none}
.dock button.on{background:var(--ink);color:#0A0D0E}
.dock button.on span{display:inline}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade var(--quick) linear}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:460px;max-height:92%;overflow:auto;background:var(--bg-2);border:1px solid var(--glass-line);border-bottom:none;border-radius:28px 28px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(40px);animation:up var(--std) var(--ease) forwards}
@keyframes up{to{transform:none}}
.sheet h2{font:500 22px/1.2 var(--ui);margin:0 0 14px;letter-spacing:-.01em}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f input,.f select,.f textarea{width:100%;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;height:44px;padding:0 16px;color:var(--ink)}
.f textarea{border-radius:18px;height:auto;min-height:80px;padding:10px 16px;resize:vertical}
.f select{appearance:none;-webkit-appearance:none}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--chip-line);border-radius:999px;padding:9px 4px;font-size:13px;color:var(--haze)}
.seg input:checked+span{background:var(--ink);color:#0A0D0E;border-color:var(--ink)}
.log{border-top:1px solid var(--chip-line);padding-top:8px;font-size:13.5px}
.log div{display:flex;gap:10px;padding:3px 0;color:var(--haze)}
.log .mono{color:var(--dim);flex:none}
.rv{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--chip-line)}
.rv input[type=checkbox]{width:18px;height:18px;margin-top:4px;accent-color:var(--signal)}
.rv b{font-weight:500}
.rv .tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:8px;background:var(--chip);color:var(--mist)}
.rv .tag.new{background:var(--signal-12);color:var(--signal)}
.rv p{margin:4px 0 0;color:var(--mist);font-size:14px}
.found{border:1px solid var(--glass-line);border-radius:18px;padding:12px;margin-top:8px}
.found b{font-weight:500}
.found p{margin:4px 0 0;color:var(--haze);font-size:14px}
.cb{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--haze);margin-bottom:12px}
.cb input{accent-color:var(--signal);width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#0A0D0E;padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 36px);opacity:0;transition:opacity var(--quick),transform var(--std) var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{background:var(--signal-12);border:1px solid var(--signal-30);border-radius:18px;padding:10px 14px;font-size:13.5px;color:var(--ink);margin-bottom:14px}
.note a{color:var(--signal)}
code{font-family:var(--mono);font-size:12.5px;background:var(--chip);padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card,.msg,.sheet{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="wordmark">KEITH<i>.</i></div>
    <div style="display:flex;gap:8px">
      <button class="ibtn" id="btn-export" aria-label="Export data" title="Export"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
      <button class="ibtn" id="btn-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </div>
  <div id="note" class="note" hidden></div>

  <!-- TODAY -->
  <section id="v-today">
    <div class="hero">
      <div class="num"><span class="mono" id="h-due">0</span><small>to ping today</small></div>
      <div class="sub" id="h-sub"></div>
      <div class="chips" id="h-chips"></div>
    </div>
    <div id="today-list"></div>
    <div class="acts" id="more-wrap" hidden><button class="pill ghost" id="more-btn"></button></div>
    <div class="sh"><h2>Track down</h2><span class="label">lost touch</span></div>
    <div id="lost-list"></div>
  </section>

  <!-- KEITH -->
  <section id="v-keith" hidden>
    <div class="orb-wrap"><div class="orb" id="orb"></div><div class="orb-state" id="orb-state">tap the mic</div></div>
    <div class="chapters" id="chapters"></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <textarea id="answer" placeholder="Or type to Keith" aria-label="Your answer"></textarea>
      <div class="bar">
        <div style="display:flex;gap:6px;align-items:center">
          <button class="pill" id="extract-btn">Pull out people</button>
          <button class="pill ghost" id="send-btn">Send</button>
        </div>
        <button class="mic" id="mic" aria-label="Talk to Keith"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      </div>
    </div>
  </section>

  <!-- PEOPLE -->
  <section id="v-people" hidden>
    <div class="hero" style="margin-bottom:6px">
      <div class="num"><span class="mono" id="h-people">0</span><small>people earned</small></div>
      <div class="sub">Not money. Not wealth. <b>The people and what you shared.</b></div>
    </div>
    <div class="acts"><button class="pill gold" id="add-btn">Add person</button><button class="pill" id="import-btn">Import contacts</button><input type="file" id="import-file" accept=".csv,.vcf,text/vcard,text/csv" hidden></div>
    <input class="search" id="search" type="search" placeholder="Search" aria-label="Search people">
    <div class="chapters" id="filters"></div>
    <div id="people-list"></div>
  </section>

  <!-- TRACKER -->
  <section id="v-track" hidden>
    <div class="hero">
      <div class="num"><span class="mono" id="t-warm">0</span><small>warm right now</small></div>
      <div class="sub" id="t-sub"></div>
    </div>
    <div class="bento">
      <div class="tile glow"><div class="v mono" id="t-pro">0</div><div class="label">Professional</div></div>
      <div class="tile sage"><div class="v mono" id="t-per">0</div><div class="label">Personal</div></div>
      <div class="tile" style="grid-column:1/-1">
        <div class="label">By chapter</div>
        <div class="bars" id="t-bars"></div>
        <div class="legend" id="t-bars-l"></div>
      </div>
      <div class="tile" style="grid-column:1/-1">
        <div class="label">Network temperature</div>
        <div class="ring" id="t-rings"></div>
        <div style="height:22px"></div>
      </div>
      <div class="tile" style="grid-column:1/-1">
        <div class="label">Pings this month</div>
        <div class="v mono" id="t-pings" style="margin-top:8px">0</div>
        <div class="rule"><b id="t-rule" style="left:0%"></b></div>
        <div class="legend"><span>0</span><span>goal <span id="t-goal">30</span></span></div>
      </div>
    </div>
  </section>
</div>

<nav class="dock" aria-label="Sections">
  <button data-v="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Today</span></button>
  <button data-v="keith"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Keith</span></button>
  <button data-v="people"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg><span>People</span></button>
  <button data-v="track"><svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-8M22 19H2"/></svg><span>Tracker</span></button>
</nav>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status"></div>

<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
